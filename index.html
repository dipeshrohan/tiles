<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiles</title>
    <meta
      name="description"
      content="Tiles — factory model, virtual sensors, root-cause analysis and design studies for industrial teams."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1' fill='%231f5f5b'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1' fill='%23c0603a'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1' fill='%23c0603a'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1' fill='%231f5f5b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- The API a deployment serves the app with; server.js fills it from TILES_API_URL. -->
    <meta name="tiles-api" content="" />
  </head>
  <body>
    <a class="skip-link" href="#/" data-skip>Skip to content</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#/">
          <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>Tiles</span>
        </a>
        <nav id="nav" aria-label="Pages"></nav>
        <div class="user" id="user"></div>
      </aside>
      <div class="main">
        <header class="topbar">
          <button
            class="icon-btn menu"
            id="menu"
            aria-label="Toggle navigation"
            aria-controls="sidebar"
            aria-expanded="false"
            data-tooltip="Menu"
          ></button>
          <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
          <button class="search-btn" id="palette-open" type="button" aria-keyshortcuts="Control+K Meta+K /">
            <span class="search-btn-label">Search…</span><kbd>Ctrl K</kbd>
          </button>
          <button
            class="icon-btn"
            id="theme"
            aria-label="Toggle light or dark theme"
            data-tooltip="Light or dark theme"
          ></button>
        </header>
        <main id="view" tabindex="-1"></main>
      </div>
    </div>
    <ol class="toaster" id="toast" aria-label="Notifications"></ol>
    <!-- Read out by screen readers when a page has news (a live region must be there before it changes). -->
    <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
    <script src="js/tiles.bundle.js" defer></script>
  </body>
</html>
