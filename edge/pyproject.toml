[project]
name = "tiles-edge"
version = "0.1.0"
description = "Tiles edge agent: runs on the plant network and sends data out to Tiles"
readme = "README.md"
requires-python = ">=3.12"
# The core is standard library only, so the agent installs anywhere and also
# ships as one zipapp file (see README). Connectors that need a protocol
# library are extras: pip install "tiles-edge[opcua]".
dependencies = []

[project.optional-dependencies]
opcua = ["asyncua>=2.1.0"]
mqtt = ["paho-mqtt>=2.1.0"]
postgresql = ["psycopg[binary]>=3.3.6"]
sqlserver = ["mssql-python>=1.15.0"]

[project.scripts]
tiles-edge = "tiles_edge.cli:main"

[dependency-groups]
dev = [
    "amqtt>=0.12.1",  # an MQTT broker for the tests
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiles_edge"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # S608: test SQL is built from constants

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["amqtt.*"]  # the test broker ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
