{{- $fullname := include "tiles.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "tiles.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tiles.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: 5173, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "tiles.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "tiles.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tiles.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "tiles.podSecurity" (dict "uid" 1000) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "tiles.image" (dict "image" .Values.images.web "root" .) }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          env:
            # The app opens this API (index.html's tiles-api meta tag).
            - name: TILES_API_URL
              value: {{ .Values.apiUrl | quote }}
          ports:
            - { name: http, containerPort: 5173 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "tiles.containerSecurity" . | nindent 12 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if gt (int .Values.web.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "tiles.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "tiles.selector" (dict "root" . "component" "web") | nindent 6 }}
{{- end }}
