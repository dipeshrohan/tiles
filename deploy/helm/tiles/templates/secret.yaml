{{- include "tiles.validate" . -}}
{{- if or .Values.database.bundled .Values.secrets.generateDataKey }}
{{- /* Generated once, then kept: an upgrade reads the values back rather than making new ones. */}}
{{- $name := include "tiles.generatedSecret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* The database's volume outlives the Secret (kept on uninstall, but deletable): a new password
       would lock the API out of it. Seen only with a cluster to look in (not `helm template`). */}}
{{- if and .Values.database.bundled (not (get $old "postgres_password")) (lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "data-%s-db-0" (include "tiles.fullname" .))) }}
{{- fail (printf "The database volume data-%s-db-0 exists but the Secret %s holding its password is gone: restore the Secret from your backup (it also holds the data key) before installing" (include "tiles.fullname" .) $name) }}
{{- end }}
{{- $password := (get $old "postgres_password" | b64dec) | default (randAlphaNum 32) }}
{{- $key := (get $old "tiles_data_keys" | b64dec) | default (printf "k%s:%s" (now | date "20060102") (randBytes 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tiles.labels" . | nindent 4 }}
  annotations:
    # Uninstalling the release keeps it: the data key opens sealed credentials, and the
    # database's volume outlives the release too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.database.bundled }}
  postgres_password: {{ $password | quote }}
  tiles_database_url: {{ printf "postgresql://tiles:%s@%s-db:5432/tiles" $password (include "tiles.fullname" .) | quote }}
  {{- end }}
  {{- if .Values.secrets.generateDataKey }}
  tiles_data_keys: {{ $key | quote }}
  {{- end }}
{{- end }}
