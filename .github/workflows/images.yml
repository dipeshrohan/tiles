# Publishes the images the Helm chart installs (T5.09) to GitHub's container registry:
# ghcr.io/<owner>/tiles-api, tiles-web and tiles-edge.
# - main, once CI has passed on the commit: `main` and `sha-<commit>`;
# - a release (called by the Release workflow once its checks pass): `1.2.3` and `1.2`.
name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: the commit to build
        type: string
        required: true
      version:
        description: the release's version (1.2.3)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    # A release, or a CI run on a push to main that passed (not one for a pull request from a
    # branch named main).
    if: >-
      inputs.version != '' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: tiles-api, context: api }
          - { image: tiles-web, context: . }
          - { image: tiles-edge, context: edge }
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }} # the commit that was checked, not whatever main is now
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ env.VERSION == '' }}
            type=raw,value=sha-${{ env.SHA }},enable=${{ env.VERSION == '' }}
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' && !contains(env.VERSION, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
