name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled download) fails the job instead of running for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run version:check # one version everywhere, with its changelog section

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Playwright container: the browser and fonts the baselines were made with (npm run
    # test:visual uses the same image). Keep its tag equal to package.json's playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: node --test --test-concurrency=1 e2e/visual/visual.test.js
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: e2e/visual/output/
          if-no-files-found: ignore

  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      db:
        # Docker Hub's images through Google's mirror: Hub's anonymous pull limit stopped this job.
        image: mirror.gcr.io/timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_USER: tiles
          POSTGRES_PASSWORD: tiles-ci
          POSTGRES_DB: tiles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tiles -d tiles"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TILES_TEST_DATABASE_URL: postgresql://tiles:tiles-ci@localhost:5432/tiles
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -W error
      - name: Upgrade from main and from the last release, and roll back (T6.04)
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin main
          scripts/upgrade-test.sh FETCH_HEAD "$TILES_TEST_DATABASE_URL"
          # The latest final release (no -rc): what sites upgrade from. A failed fetch fails the step.
          code=0; git ls-remote --exit-code --tags origin 'refs/tags/v*' > /dev/null || code=$?
          case $code in
            0) git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*' ;;
            2) ;; # no release tags yet
            *) exit "$code" ;;
          esac
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$last" ]; then
            scripts/upgrade-test.sh "$last" "$TILES_TEST_DATABASE_URL"
          else
            echo "No release tagged yet: the upgrade from main covers it"
          fi
      - name: Edge agent checks
        working-directory: edge
        env:
          TILES_EDGE_TEST_DOCKER: '1' # the SQL connector tests run PostgreSQL and SQL Server in Docker
        run: |
          # What the SQL Server driver's bundled ODBC driver loads (as in the container image)
          sudo apt-get install -y --no-install-recommends libltdl7 libkrb5-3 libgssapi-krb5-2
          uv sync --locked --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -W error
      - name: Edge agent as one file
        working-directory: edge
        run: |
          python3 -m zipapp src -m tiles_edge.cli:entry -p "/usr/bin/env python3" -o "$RUNNER_TEMP/tiles-edge.pyz"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          "$RUNNER_TEMP/tiles-edge.pyz" --version | grep -qx "tiles-edge $version"
          set +e; "$RUNNER_TEMP/tiles-edge.pyz" check -c /nonexistent.toml; code=$?; set -e
          test "$code" = 2  # exit codes survive the zipapp

  security:
    name: Dependency and container scanning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.56.2
      # Trivy's vulnerability database from Google's mirror, which rate-limits CI less than ghcr.io.
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          images: >-
            python:3.13-slim
            node:22-alpine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      # Each check runs whatever the others found, so one run reports every problem.
      - name: npm dependencies (npm audit)
        if: ${{ !cancelled() }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Python dependencies that ship, of the API and the edge agent (pip-audit)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for project in api edge; do
            (cd "$project" && uv export --locked --all-extras --no-dev --no-hashes --no-emit-project \
              --format requirements-txt > "$RUNNER_TEMP/$project-requirements.txt")
            uvx pip-audit==2.10.1 --strict --no-deps --disable-pip -r "$RUNNER_TEMP/$project-requirements.txt" || status=1
          done
          exit $status
      - name: Build the images
        id: build
        if: ${{ !cancelled() }}
        run: |
          docker build -t tiles-api:scan api
          docker build -t tiles-edge:scan edge
          docker build -t tiles-web:scan .
      - name: Scan the images (Trivy; high and critical findings with a fix fail the build)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          trivy() {
            docker run --rm -e TRIVY_DB_REPOSITORY -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE" "$@"
          }
          status=0
          for image in tiles-api:scan tiles-edge:scan tiles-web:scan; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "$image" || status=1
          done
          exit $status
      - name: Software bills of materials (CycloneDX)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/sbom"
          trivy() {
            docker run --rm -e TRIVY_DB_REPOSITORY -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/root/.cache" -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/sbom:/out" \
              "$TRIVY_IMAGE" "$@"
          }
          trivy fs --format cyclonedx --output /out/tiles-source.cdx.json /src
          if [ "${{ steps.build.outcome }}" = success ]; then
            trivy image --format cyclonedx --output /out/tiles-api-image.cdx.json tiles-api:scan
            trivy image --format cyclonedx --output /out/tiles-edge-image.cdx.json tiles-edge:scan
            trivy image --format cyclonedx --output /out/tiles-web-image.cdx.json tiles-web:scan
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          if-no-files-found: warn

  restore:
    name: Restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          images: >-
            timescale/timescaledb:2.30.2-pg17
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked --project api
      - name: Point-in-time recovery of a Tiles database (docs/runbooks/backups.md)
        run: DRILL_REPORT="$RUNNER_TEMP/drill.md" deploy/backup/pitr-drill.sh
      - name: Timing
        run: cat "$RUNNER_TEMP/drill.md" >> "$GITHUB_STEP_SUMMARY"
  helm:
    name: Helm chart on Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHART: deploy/helm/tiles
      # Production settings: sign-in from an issuer (only asked when a token arrives), data keys.
      VALUES: >-
        --set oidc.issuer=https://idp.example.com/realms/tiles
        --set images.api.repository=tiles-api --set images.api.tag=ci --set images.api.pullPolicy=Never
        --set images.web.repository=tiles-web --set images.web.tag=ci --set images.web.pullPolicy=Never
        --set api.replicas=2 --set api.seedDemo=true --set database.storage=1Gi
        --set url=http://localhost:5173 --set apiUrl=http://localhost:8000
        --set sandbox.enabled=true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          images: >-
            python:3.13-slim
            node:22-alpine
            timescale/timescaledb:2.30.2-pg17
            redis:7.4-alpine
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint, render and validate (kubeconform)
        run: |
          helm lint "$CHART" $VALUES
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          for extra in "" "--set ingress.enabled=true --set ingress.tlsSecret=tiles-tls --set apiUrl=http://api.localhost:8000" \
            "--set database.bundled=false --set redis.bundled=false --set secrets.existingSecret=tiles --set secrets.generateDataKey=false"; do
            helm template t "$CHART" --kube-version 1.33.0 $VALUES $extra \
              | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.33.0
          done
          # The egress allowlist (T5.11) is valid Cilium, checked against its published schema.
          helm template t "$CHART" --kube-version 1.33.0 $VALUES --set networkPolicy.egressAllowlist.enabled=true \
              --set smtp.host=mail.example.com --set copilot.model=m --set 'networkPolicy.egressAllowlist.namespaces[0]=monitoring' \
              --set 'networkPolicy.egressAllowlist.cidrs[0]=10.20.0.5/32' \
            | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.33.0 -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          # A collector in the cluster is allowed by its namespace (toFQDNs can't name it).
          helm template t "$CHART" --kube-version 1.33.0 $VALUES --set networkPolicy.egressAllowlist.enabled=true \
              --set monitoring.otlpEndpoint=http://otel-collector.monitoring.svc:4318 --show-only templates/egress.yaml > egress.txt
          grep -q 'k8s:io.kubernetes.pod.namespace: "monitoring"' egress.txt
          if grep -q otel-collector egress.txt; then echo "an in-cluster host in toFQDNs"; exit 1; fi
          # Model endpoints' hosts (T4.15) reach the API's settings and the allowlist.
          helm template t "$CHART" --kube-version 1.33.0 $VALUES --set networkPolicy.egressAllowlist.enabled=true \
              --set 'models.endpointHosts[0]=models.example.com' > models.txt
          grep -q 'matchName: "models.example.com"' models.txt
          grep -q 'value: "\[\\"models.example.com\\"\]"' models.txt
          # Settings that can't work are refused before anything is installed. (Not `! a && b`:
          # errexit ignores a failure there, so the check could never fail.)
          refused() { if helm template t "$CHART" --kube-version 1.33.0 "${@:2}" 2> err.txt; then exit 1; fi; grep -q "$1" err.txt; }
          refused 'needs oidc.issuer' --set env=production
          refused 'http(s) origins' $VALUES --set apiUrl=api.example.com
          refused 'different host names' $VALUES --set ingress.enabled=true
      - uses: helm/kind-action@v1
        with:
          cluster_name: tiles
      - name: Build the images into the cluster
        run: |
          docker build -t tiles-api:ci api
          docker build -t tiles-web:ci .
          kind load docker-image tiles-api:ci tiles-web:ci --name tiles
          # The chart's other images (the database, Redis), fetched through the mirror at the start
          # of the job: kind's nodes would pull them from Docker Hub themselves.
          for image in $(helm template t "$CHART" --kube-version 1.33.0 $VALUES | awk '$1 == "image:" { gsub(/"/, "", $2); print $2 }' | sort -u | grep -v '^tiles-'); do
            kind load docker-image "$image" --name tiles
          done
      - name: Install
        run: |
          # Every pod meets the restricted Pod Security Standard (the Terraform module enforces it).
          kubectl label namespace default pod-security.kubernetes.io/enforce=restricted --overwrite
          helm install tiles "$CHART" $VALUES --wait --timeout 10m
      - name: The API answers, ready, behind its sign-in; the app opens it
        run: |
          kubectl port-forward svc/tiles-api 8000 >/dev/null 2>&1 &
          kubectl port-forward svc/tiles-web 5173 >/dev/null 2>&1 &
          sleep 3
          curl -fsS http://localhost:8000/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/health | grep -q '"env":"production"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/sites)" = 401
          curl -fsS http://localhost:5173/ | grep -q '<meta name="tiles-api" content="http://localhost:8000" />'
      - name: A scheduled job runs to completion
        run: |
          for job in tiles-check-quality tiles-notify; do
            kubectl create job "$job-now" --from="cronjob/$job"
            kubectl wait --for=condition=complete "job/$job-now" --timeout=180s
            kubectl logs "job/$job-now"
          done
      - name: A model from GitHub runs in the sandbox, as the API calls it
        run: |
          kubectl exec -i deploy/tiles-api -- python - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, zipfile
          code = io.BytesIO()
          with zipfile.ZipFile(code, "w") as z:
              z.writestr("model.py", "import math\ndef run(inputs, params):\n    return {'y': [math.sqrt(params['a'])]}\n")
          raw = code.getvalue()
          token = open("/var/run/secrets/tiles/tiles_sandbox_token").read().strip()
          body = {"code_sha256": hashlib.sha256(raw).hexdigest(), "code": base64.b64encode(raw).decode(),
                  "entry": "model.py", "inputs": {}, "params": {"a": 9}}
          req = urllib.request.Request(os.environ["TILES_SANDBOX_URL"] + "/run", data=json.dumps(body).encode(),
                                       headers={"Authorization": f"Bearer {token}"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as res:
              reply = json.load(res)
          assert reply == {"outputs": {"y": [3.0]}}, reply
          print(reply)
          PY
      - name: An upgrade keeps the generated password and data key
        run: |
          before=$(kubectl get secret tiles-generated -o jsonpath='{.data}')
          helm upgrade tiles "$CHART" $VALUES --set api.replicas=3 --wait --timeout 10m
          test "$before" = "$(kubectl get secret tiles-generated -o jsonpath='{.data}')"
          kubectl rollout status deploy/tiles-api
      - name: A lost Secret is refused, not replaced, while the database volume is there
        run: |
          kubectl delete secret tiles-generated
          if helm upgrade tiles "$CHART" $VALUES 2> err.txt; then exit 1; fi
          grep 'holding its password is gone' err.txt
      - name: State on failure
        if: failure()
        run: |
          kubectl get all,pvc,secrets -o wide
          kubectl describe pods
          for pod in $(kubectl get pods -o name); do kubectl logs "$pod" --all-containers --tail=80 || true; done

  copilot-eval-setup:
    # Whether the copilot's evaluation can run: secrets can't decide a job's `if`, so a step does.
    name: Copilot evaluation settings
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.TILES_ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.TILES_COPILOT_MODEL }}
        run: |
          if [ -n "$KEY" ] && [ -n "$MODEL" ]; then
            echo configured=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Set the TILES_ANTHROPIC_API_KEY secret and the TILES_COPILOT_MODEL variable to run the copilot's evaluation"
            echo configured=false >> "$GITHUB_OUTPUT"
          fi

  copilot-eval:
    # The copilot's evaluation gate (T4.06): every case of api/src/tiles_api/evaluation/cases.json
    # asked of Claude on the evaluation plant; at least 85% correct, no unsupported claims, 90% of
    # tools chosen right. Only when the repository has the copilot's key and model.
    name: Copilot evaluation
    needs: copilot-eval-setup
    if: needs.copilot-eval-setup.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: mirror.gcr.io/timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_USER: tiles
          POSTGRES_PASSWORD: tiles-ci
          POSTGRES_DB: tiles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tiles -d tiles"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TILES_DATABASE_URL: postgresql://tiles:tiles-ci@localhost:5432/tiles
      TILES_ANTHROPIC_API_KEY: ${{ secrets.TILES_ANTHROPIC_API_KEY }}
      TILES_COPILOT_MODEL: ${{ vars.TILES_COPILOT_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Ask every case, and hold the answers to the gate
        run: |
          uv sync --locked
          uv run tiles-migrate upgrade
          status=0
          uv run tiles-evaluate --report "$RUNNER_TEMP/evaluation.md" --json "$RUNNER_TEMP/evaluation.json" || status=$?
          cat "$RUNNER_TEMP/evaluation.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copilot-evaluation
          path: ${{ runner.temp }}/evaluation.*
          if-no-files-found: ignore

  monitoring:
    name: Alert rules and collector configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Google's mirror of Docker Hub, which rate-limits CI less.
      - name: The alert rules fire when they should (promtool)
        run: |
          docker run --rm -v "$PWD/deploy:/deploy:ro" --entrypoint promtool mirror.gcr.io/prom/prometheus:v3.5.0 \
            check rules /deploy/helm/tiles/files/alerts.yaml
          docker run --rm -v "$PWD/deploy:/deploy:ro" --entrypoint promtool mirror.gcr.io/prom/prometheus:v3.5.0 \
            test rules /deploy/monitoring/alerts.test.yaml
      - name: The collector configuration is valid
        run: |
          docker run --rm -e TRACES_ENDPOINT=http://tempo:4318 -v "$PWD/deploy/monitoring:/m:ro" \
            mirror.gcr.io/otel/opentelemetry-collector-contrib:0.135.0 validate --config=/m/otel-collector.yaml
      - name: The dashboard is valid JSON
        run: python3 -m json.tool deploy/helm/tiles/files/grafana-dashboard.json > /dev/null

  terraform:
    name: Terraform modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Formatted
        run: terraform fmt -check -recursive -diff
      - name: Every root validates with its locked providers
        run: |
          for d in modules/tiles modules/azure environments/managed-azure/cluster environments/managed-azure/tiles environments/customer-hosted; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - name: The modules plan what they should (terraform test, mock providers)
        run: |
          terraform -chdir=modules/tiles test
          terraform -chdir=modules/azure test
      - name: No high or critical misconfiguration (trivy config)
        run: |
          docker run --rm -v "$PWD:/src:ro" mirror.gcr.io/aquasec/trivy:0.56.2 \
            config --severity HIGH,CRITICAL --exit-code 1 /src

  install:
    name: Install dry run (docs/install.md)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          images: >-
            python:3.13-slim
            node:22-alpine
            timescale/timescaledb:2.30.2-pg17
            redis:7.4-alpine
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: helm/kind-action@v1
        with:
          cluster_name: tiles-install
      - name: The images, as a mirror would hold them
        run: |
          docker build -t tiles-api:ci api
          docker build -t tiles-web:ci .
          kind load docker-image tiles-api:ci tiles-web:ci --name tiles-install
          # The chart's other images (the database, Redis), fetched through the mirror at the start.
          for image in $(helm template t deploy/helm/tiles --kube-version 1.33.0 --set oidc.issuer=https://idp.example.com | awk '$1 == "image:" { gsub(/"/, "", $2); print $2 }' | sort -u | grep -v '/tiles-'); do
            kind load docker-image "$image" --name tiles-install
          done
      - name: Install with the customer-hosted Terraform, as the guide does
        working-directory: deploy/terraform/environments/customer-hosted
        env:
          TF_VAR_smtp_password: first-password
        run: |
          # The guide's terraform.tfvars, as step 3 starts it; then only what kind needs, which
          # *.auto.tfvars overrides: its context, the images built here, no ingress controller,
          # a small volume on kind's storage class.
          cp terraform.tfvars.example terraform.tfvars
          cat > kind.auto.tfvars <<'TFVARS'
          kube_context    = "kind-tiles-install"
          image_tag       = "ci"
          images          = { registry = "", pull_policy = "Never" }
          url             = "http://localhost:5173"
          api_url         = "http://localhost:8000"
          storage_class   = ""
          database_size   = "1Gi"
          ingress_enabled = false
          TFVARS
          terraform init -input=false
          terraform plan -input=false -out tiles.plan
          terraform apply -input=false tiles.plan
      - name: Tiles answers, ready, behind its sign-in; the namespace is restricted
        run: |
          test "$(kubectl get ns tiles -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}')" = restricted
          kubectl -n tiles port-forward svc/tiles-api 8000 >/dev/null 2>&1 &
          kubectl -n tiles port-forward svc/tiles-web 5173 >/dev/null 2>&1 &
          # Until the port-forwards listen.
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://localhost:8000/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:5173/
          curl -fsS http://localhost:8000/health | grep -q '"env":"production"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/sites)" = 401
          curl -fsS http://localhost:5173/ | grep -q '<meta name="tiles-api" content="http://localhost:8000" />'
      - name: A second plan changes nothing
        working-directory: deploy/terraform/environments/customer-hosted
        env:
          TF_VAR_smtp_password: first-password
        run: terraform plan -input=false -detailed-exitcode
      - name: A changed secret restarts the API, and the data key stays
        working-directory: deploy/terraform/environments/customer-hosted
        env:
          TF_VAR_smtp_password: second-password
        run: |
          key=$(kubectl -n tiles get secret tiles-settings -o jsonpath='{.data.tiles_data_keys}')
          before=$(kubectl -n tiles get deploy tiles-api -o jsonpath='{.spec.template.metadata.annotations.tiles/secrets-revision}')
          terraform apply -input=false -auto-approve
          after=$(kubectl -n tiles get deploy tiles-api -o jsonpath='{.spec.template.metadata.annotations.tiles/secrets-revision}')
          test -n "$before" && test "$before" != "$after"
          test "$key" = "$(kubectl -n tiles get secret tiles-settings -o jsonpath='{.data.tiles_data_keys}')"
          kubectl -n tiles rollout status deploy/tiles-api --timeout 5m
      - name: Terraform won't destroy the data key
        working-directory: deploy/terraform/environments/customer-hosted
        env:
          TF_VAR_smtp_password: second-password
        # A destroy plan, never a destroy: refused, it must name prevent_destroy.
        run: |
          if terraform plan -destroy -input=false -no-color > out.txt 2>&1; then
            cat out.txt; echo "a destroy plan was allowed"; exit 1
          fi
          grep -q 'prevent_destroy' out.txt
      - name: State on failure
        if: failure()
        run: |
          kubectl -n tiles get all,pvc,secrets -o wide
          kubectl -n tiles describe pods
          kubectl -n tiles logs deploy/tiles-api --all-containers --tail 100

  stack:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          images: >-
            python:3.13-slim
            node:22-alpine
            timescale/timescaledb:2.30.2-pg17
            redis:7-alpine
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Check every service
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:5173/
          docker compose exec -T db psql -U tiles -d tiles -tAc "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'" | grep -q .
          docker compose run --rm migrate tiles-migrate current | tee /dev/stderr | grep -q '(head)'
      - name: Sign in through Keycloak and call the API with the token
        run: |
          token() {
            curl -fsS -X POST http://localhost:8080/realms/tiles/protocol/openid-connect/token \
              -d grant_type=password -d client_id=tiles-dev-cli -d scope=openid \
              -d username="$1" -d password="$2" | jq -er .access_token
          }
          t=$(token demo demo)
          curl -fsS http://localhost:8000/me -H "Authorization: Bearer $t" | tee /dev/stderr | jq -e '.via == "oidc" and .email == "demo@example.com"'
          site=$(curl -fsS http://localhost:8000/sites -H "Authorization: Bearer $t" | jq -er '.[0].id')
          curl -fsS -o /dev/null "http://localhost:8000/sites/$site/ontology/graph" -H "Authorization: Bearer $t"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/me -H "Authorization: Bearer ${t%?}x")" = 401
      - name: Ontology round trip through the API
        run: |
          site=$(curl -fsS http://localhost:8000/sites | jq -er '.[0].id')
          api=http://localhost:8000/sites/$site/ontology
          curl -fsS -X POST $api/staged -H 'content-type: application/json' \
            -d '{"kind":"addNode","node":{"id":"ci-line","type":"Line","label":"CI line","props":{}}}'
          curl -fsS -X POST $api/commits -H 'content-type: application/json' -d '{"message":"ci smoke"}'
          curl -fsS "$api/graph?view=head" | jq -e '.nodes["ci-line"].label == "CI line"'
          curl -fsS $api/commits | jq -e '.[0].message == "ci smoke"'
      - name: Register an edge agent and run it against the API
        run: |
          t=$(curl -fsS -X POST http://localhost:8080/realms/tiles/protocol/openid-connect/token \
            -d grant_type=password -d client_id=tiles-dev-cli -d scope=openid \
            -d username=admin -d password=admin | jq -er .access_token)
          site=$(curl -fsS http://localhost:8000/sites -H "Authorization: Bearer $t" | jq -er '.[0].id')
          token=$(curl -fsS -X POST "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
            -H 'content-type: application/json' -d '{"name":"ci-edge"}' | jq -er .token)
          mkdir -p "$RUNNER_TEMP/edge"
          # A small plant database for the SQL connector: three readings that must reach TimescaleDB.
          python3 -c "
          import sqlite3
          db = sqlite3.connect('$RUNNER_TEMP/edge/plant.sqlite')
          db.execute('CREATE TABLE quality (id INTEGER PRIMARY KEY, at TEXT, temperature REAL)')
          db.executemany('INSERT INTO quality (at, temperature) VALUES (datetime(\\'now\\', ?), ?)',
                         [('-3 minutes', 20.5), ('-2 minutes', 21.0), ('-1 minutes', 21.5)])
          db.commit()
          "
          cat > "$RUNNER_TEMP/edge/tiles-edge.toml" <<'TOML'
          [tiles]
          url = "http://localhost:8000"
          [agent]
          heartbeat_seconds = 30
          [[sql]]
          name = "plant-db"
          engine = "sqlite"
          path = "plant.sqlite"
          poll_seconds = 2
          [[sql.queries]]
          name = "quality"
          query = "SELECT id, at, temperature FROM quality WHERE id > :watermark ORDER BY id"
          watermark = "id"
          start = 0
          time = "at"
          columns = { temperature = "ci.temperature" }
          TOML
          docker build -t tiles-edge edge
          # The SQL drivers load in the image (a refused connection, not a missing library)
          docker run --rm --entrypoint python tiles-edge -c "
          import psycopg, mssql_python
          try:
              mssql_python.connect('Server=tcp:127.0.0.1,1;UID=x;PWD=y;Encrypt=yes', attrs_before={103: 2})
          except Exception as e:
              assert 'Failed to load the driver' not in str(e), e
          "
          docker run --rm --network host -e TILES_EDGE_TOKEN="$token" -v "$RUNNER_TEMP/edge:/etc/tiles-edge:ro" \
            tiles-edge check -c /etc/tiles-edge/tiles-edge.toml | tee /dev/stderr | jq -e .ok
          curl -fsS "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
            | tee /dev/stderr | jq -e '.[] | select(.name == "ci-edge") | .status == "online"'
          # `run` reads the database into its disk buffer (the image's /var/lib/tiles-edge), sends the
          # readings to Tiles, and reports the buffer in its heartbeat.
          docker run -d --name ci-edge --network host -e TILES_EDGE_TOKEN="$token" \
            -v "$RUNNER_TEMP/edge:/etc/tiles-edge:ro" tiles-edge
          stored="SELECT count(*) FROM samples s JOIN signals g ON g.id = s.signal_id WHERE g.tag = 'ci.temperature'"
          for _ in $(seq 60); do
            test "$(docker compose exec -T db psql -U tiles -d tiles -tAc "$stored")" = 3 && break
            sleep 1
          done
          docker logs ci-edge
          test "$(docker compose exec -T db psql -U tiles -d tiles -tAc "$stored")" = 3
          for _ in $(seq 40); do  # the next heartbeat (every 30 s) reports them sent
            curl -fsS "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
              | jq -e '.[] | select(.name == "ci-edge") | .buffer | .sent == 3 and .queued == 0' && break
            sleep 1
          done
          curl -fsS "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" | tee /dev/stderr \
            | jq -e '.[] | select(.name == "ci-edge") | .buffer.sent == 3 and (.connectors[0].status == "ok")'
          docker stop ci-edge
      - name: The agent as a sandboxed systemd service (edge/deploy/tiles-edge.service)
        run: |
          set -o pipefail
          t=$(curl -fsS -X POST http://localhost:8080/realms/tiles/protocol/openid-connect/token \
            -d grant_type=password -d client_id=tiles-dev-cli -d scope=openid \
            -d username=admin -d password=admin | jq -er .access_token)
          site=$(curl -fsS http://localhost:8000/sites -H "Authorization: Bearer $t" | jq -er '.[0].id')
          token=$(curl -fsS -X POST "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
            -H 'content-type: application/json' -d '{"name":"ci-edge-systemd"}' | jq -er .token)
          # Installed as edge/deploy/tiles-edge.service says.
          sudo useradd --system --home /var/lib/tiles-edge --shell /usr/sbin/nologin tiles-edge
          sudo python3 -m venv /opt/tiles-edge
          sudo /opt/tiles-edge/bin/pip install --quiet "./edge[opcua,mqtt]"
          sudo install -m 644 edge/deploy/tiles-edge.service /etc/systemd/system/
          sudo install -d -o root -g tiles-edge -m 750 /etc/tiles-edge
          printf '[tiles]\nurl = "http://localhost:8000"\ntoken_file = "token"\n[agent]\nheartbeat_seconds = 5\n' \
            | sudo tee /etc/tiles-edge/tiles-edge.toml > /dev/null
          printf '%s' "$token" | sudo install -o tiles-edge -m 600 /dev/stdin /etc/tiles-edge/token
          sudo systemctl daemon-reload
          sudo systemd-analyze verify /etc/systemd/system/tiles-edge.service
          # The sandbox holds: systemd's exposure score stays at or below 2.0 (1.1 when written).
          # --threshold counts in tenths of the score it prints, so 20 is 2.0.
          sudo systemd-analyze security --threshold=20 tiles-edge.service | tail -1
          sudo systemctl start tiles-edge
          for _ in $(seq 30); do
            status=$(curl -fsS "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
              | jq -r '.[] | select(.name == "ci-edge-systemd") | .status')
            [ "$status" = online ] && break
            sleep 2
          done
          sudo journalctl -u tiles-edge --no-pager | tail -20
          test "$status" = online
          # It listens on nothing, and stops cleanly. (A negated pipeline wouldn't fail the step.)
          if sudo ss -ltnup | grep tiles-edge; then echo "the agent listens on a port"; exit 1; fi
          sudo systemctl stop tiles-edge
          test "$(systemctl show -p Result --value tiles-edge)" = success
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
