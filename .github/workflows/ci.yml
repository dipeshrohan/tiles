name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    # A hung step (e.g. a stalled download) fails the job instead of running for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run version:check # one version everywhere, with its changelog section

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg17
        env:
          POSTGRES_USER: tiles
          POSTGRES_PASSWORD: tiles-ci
          POSTGRES_DB: tiles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tiles -d tiles"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TILES_TEST_DATABASE_URL: postgresql://tiles:tiles-ci@localhost:5432/tiles
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -W error
      - name: Upgrade from main and from the last release, and roll back (T6.04)
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin main
          scripts/upgrade-test.sh FETCH_HEAD "$TILES_TEST_DATABASE_URL"
          # The latest final release (no -rc): what sites upgrade from. A failed fetch fails the step.
          code=0; git ls-remote --exit-code --tags origin 'refs/tags/v*' > /dev/null || code=$?
          case $code in
            0) git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*' ;;
            2) ;; # no release tags yet
            *) exit "$code" ;;
          esac
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$last" ]; then
            scripts/upgrade-test.sh "$last" "$TILES_TEST_DATABASE_URL"
          else
            echo "No release tagged yet: the upgrade from main covers it"
          fi
      - name: Edge agent checks
        working-directory: edge
        env:
          TILES_EDGE_TEST_DOCKER: '1' # the SQL connector tests run PostgreSQL and SQL Server in Docker
        run: |
          # What the SQL Server driver's bundled ODBC driver loads (as in the container image)
          sudo apt-get install -y --no-install-recommends libltdl7 libkrb5-3 libgssapi-krb5-2
          uv sync --locked --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -W error
      - name: Edge agent as one file
        working-directory: edge
        run: |
          python3 -m zipapp src -m tiles_edge.cli:entry -p "/usr/bin/env python3" -o "$RUNNER_TEMP/tiles-edge.pyz"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          "$RUNNER_TEMP/tiles-edge.pyz" --version | grep -qx "tiles-edge $version"
          set +e; "$RUNNER_TEMP/tiles-edge.pyz" check -c /nonexistent.toml; code=$?; set -e
          test "$code" = 2  # exit codes survive the zipapp

  security:
    name: Dependency and container scanning
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIVY_IMAGE: aquasec/trivy:0.56.2
      # Trivy's vulnerability database from Google's mirror, which rate-limits CI less than ghcr.io.
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      # Each check runs whatever the others found, so one run reports every problem.
      - name: npm dependencies (npm audit)
        if: ${{ !cancelled() }}
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Python dependencies that ship, of the API and the edge agent (pip-audit)
        if: ${{ !cancelled() }}
        run: |
          status=0
          for project in api edge; do
            (cd "$project" && uv export --locked --all-extras --no-dev --no-hashes --no-emit-project \
              --format requirements-txt > "$RUNNER_TEMP/$project-requirements.txt")
            uvx pip-audit==2.10.1 --strict --no-deps --disable-pip -r "$RUNNER_TEMP/$project-requirements.txt" || status=1
          done
          exit $status
      - name: Build the images
        id: build
        if: ${{ !cancelled() }}
        run: |
          docker build -t tiles-api:scan api
          docker build -t tiles-edge:scan edge
          docker build -t tiles-web:scan .
      - name: Scan the images (Trivy; high and critical findings with a fix fail the build)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          trivy() {
            docker run --rm -e TRIVY_DB_REPOSITORY -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE" "$@"
          }
          status=0
          for image in tiles-api:scan tiles-edge:scan tiles-web:scan; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "$image" || status=1
          done
          exit $status
      - name: Software bills of materials (CycloneDX)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/sbom"
          trivy() {
            docker run --rm -e TRIVY_DB_REPOSITORY -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy:/root/.cache" -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/sbom:/out" \
              "$TRIVY_IMAGE" "$@"
          }
          trivy fs --format cyclonedx --output /out/tiles-source.cdx.json /src
          if [ "${{ steps.build.outcome }}" = success ]; then
            trivy image --format cyclonedx --output /out/tiles-api-image.cdx.json tiles-api:scan
            trivy image --format cyclonedx --output /out/tiles-edge-image.cdx.json tiles-edge:scan
            trivy image --format cyclonedx --output /out/tiles-web-image.cdx.json tiles-web:scan
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
          if-no-files-found: warn

  restore:
    name: Restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked --project api
      - name: Point-in-time recovery of a Tiles database (docs/runbooks/backups.md)
        run: DRILL_REPORT="$RUNNER_TEMP/drill.md" deploy/backup/pitr-drill.sh
      - name: Timing
        run: cat "$RUNNER_TEMP/drill.md" >> "$GITHUB_STEP_SUMMARY"
  helm:
    name: Helm chart on Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHART: deploy/helm/tiles
      # Production settings: sign-in from an issuer (only asked when a token arrives), data keys.
      VALUES: >-
        --set oidc.issuer=https://idp.example.com/realms/tiles
        --set images.api.repository=tiles-api --set images.api.tag=ci --set images.api.pullPolicy=Never
        --set images.web.repository=tiles-web --set images.web.tag=ci --set images.web.pullPolicy=Never
        --set api.replicas=2 --set api.seedDemo=true --set database.storage=1Gi
        --set url=http://localhost:5173 --set apiUrl=http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint, render and validate (kubeconform)
        run: |
          helm lint "$CHART" $VALUES
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          for extra in "" "--set ingress.enabled=true --set ingress.tlsSecret=tiles-tls --set apiUrl=http://api.localhost:8000" \
            "--set database.bundled=false --set redis.bundled=false --set secrets.existingSecret=tiles --set secrets.generateDataKey=false"; do
            helm template t "$CHART" --kube-version 1.33.0 $VALUES $extra \
              | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.33.0
          done
          # Settings that can't work are refused before anything is installed.
          ! helm template t "$CHART" --kube-version 1.33.0 --set env=production 2> err.txt && grep -q 'needs oidc.issuer' err.txt
          ! helm template t "$CHART" --kube-version 1.33.0 $VALUES --set apiUrl=api.example.com 2> err.txt && grep -q 'http(s) origins' err.txt
          ! helm template t "$CHART" --kube-version 1.33.0 $VALUES --set ingress.enabled=true 2> err.txt && grep -q 'different host names' err.txt
      - uses: helm/kind-action@v1
        with:
          cluster_name: tiles
      - name: Build the images into the cluster
        run: |
          docker build -t tiles-api:ci api
          docker build -t tiles-web:ci .
          kind load docker-image tiles-api:ci tiles-web:ci --name tiles
      - name: Install
        run: helm install tiles "$CHART" $VALUES --wait --timeout 10m
      - name: The API answers, ready, behind its sign-in; the app opens it
        run: |
          kubectl port-forward svc/tiles-api 8000 >/dev/null 2>&1 &
          kubectl port-forward svc/tiles-web 5173 >/dev/null 2>&1 &
          sleep 3
          curl -fsS http://localhost:8000/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/health | grep -q '"env":"production"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/sites)" = 401
          curl -fsS http://localhost:5173/ | grep -q '<meta name="tiles-api" content="http://localhost:8000" />'
      - name: A scheduled job runs to completion
        run: |
          for job in tiles-check-quality tiles-notify; do
            kubectl create job "$job-now" --from="cronjob/$job"
            kubectl wait --for=condition=complete "job/$job-now" --timeout=180s
            kubectl logs "job/$job-now"
          done
      - name: An upgrade keeps the generated password and data key
        run: |
          before=$(kubectl get secret tiles-generated -o jsonpath='{.data}')
          helm upgrade tiles "$CHART" $VALUES --set api.replicas=3 --wait --timeout 10m
          test "$before" = "$(kubectl get secret tiles-generated -o jsonpath='{.data}')"
          kubectl rollout status deploy/tiles-api
      - name: A lost Secret is refused, not replaced, while the database volume is there
        run: |
          kubectl delete secret tiles-generated
          ! helm upgrade tiles "$CHART" $VALUES 2> err.txt
          grep 'holding its password is gone' err.txt
      - name: State on failure
        if: failure()
        run: |
          kubectl get all,pvc,secrets -o wide
          kubectl describe pods
          for pod in $(kubectl get pods -o name); do kubectl logs "$pod" --all-containers --tail=80 || true; done

  monitoring:
    name: Alert rules and collector configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Google's mirror of Docker Hub, which rate-limits CI less.
      - name: The alert rules fire when they should (promtool)
        run: |
          docker run --rm -v "$PWD/deploy:/deploy:ro" --entrypoint promtool mirror.gcr.io/prom/prometheus:v3.5.0 \
            check rules /deploy/helm/tiles/files/alerts.yaml
          docker run --rm -v "$PWD/deploy:/deploy:ro" --entrypoint promtool mirror.gcr.io/prom/prometheus:v3.5.0 \
            test rules /deploy/monitoring/alerts.test.yaml
      - name: The collector configuration is valid
        run: |
          docker run --rm -e TRACES_ENDPOINT=http://tempo:4318 -v "$PWD/deploy/monitoring:/m:ro" \
            mirror.gcr.io/otel/opentelemetry-collector-contrib:0.135.0 validate --config=/m/otel-collector.yaml
      - name: The dashboard is valid JSON
        run: python3 -m json.tool deploy/helm/tiles/files/grafana-dashboard.json > /dev/null

  stack:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Check every service
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://localhost:5173/
          docker compose exec -T db psql -U tiles -d tiles -tAc "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'" | grep -q .
          docker compose run --rm migrate tiles-migrate current | tee /dev/stderr | grep -q '(head)'
      - name: Sign in through Keycloak and call the API with the token
        run: |
          token() {
            curl -fsS -X POST http://localhost:8080/realms/tiles/protocol/openid-connect/token \
              -d grant_type=password -d client_id=tiles-dev-cli -d scope=openid \
              -d username="$1" -d password="$2" | jq -er .access_token
          }
          t=$(token demo demo)
          curl -fsS http://localhost:8000/me -H "Authorization: Bearer $t" | tee /dev/stderr | jq -e '.via == "oidc" and .email == "demo@example.com"'
          site=$(curl -fsS http://localhost:8000/sites -H "Authorization: Bearer $t" | jq -er '.[0].id')
          curl -fsS -o /dev/null "http://localhost:8000/sites/$site/ontology/graph" -H "Authorization: Bearer $t"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/me -H "Authorization: Bearer ${t%?}x")" = 401
      - name: Ontology round trip through the API
        run: |
          site=$(curl -fsS http://localhost:8000/sites | jq -er '.[0].id')
          api=http://localhost:8000/sites/$site/ontology
          curl -fsS -X POST $api/staged -H 'content-type: application/json' \
            -d '{"kind":"addNode","node":{"id":"ci-line","type":"Line","label":"CI line","props":{}}}'
          curl -fsS -X POST $api/commits -H 'content-type: application/json' -d '{"message":"ci smoke"}'
          curl -fsS "$api/graph?view=head" | jq -e '.nodes["ci-line"].label == "CI line"'
          curl -fsS $api/commits | jq -e '.[0].message == "ci smoke"'
      - name: Register an edge agent and run it against the API
        run: |
          t=$(curl -fsS -X POST http://localhost:8080/realms/tiles/protocol/openid-connect/token \
            -d grant_type=password -d client_id=tiles-dev-cli -d scope=openid \
            -d username=admin -d password=admin | jq -er .access_token)
          site=$(curl -fsS http://localhost:8000/sites -H "Authorization: Bearer $t" | jq -er '.[0].id')
          token=$(curl -fsS -X POST "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
            -H 'content-type: application/json' -d '{"name":"ci-edge"}' | jq -er .token)
          mkdir -p "$RUNNER_TEMP/edge"
          # A small plant database for the SQL connector: three readings that must reach TimescaleDB.
          python3 -c "
          import sqlite3
          db = sqlite3.connect('$RUNNER_TEMP/edge/plant.sqlite')
          db.execute('CREATE TABLE quality (id INTEGER PRIMARY KEY, at TEXT, temperature REAL)')
          db.executemany('INSERT INTO quality (at, temperature) VALUES (datetime(\\'now\\', ?), ?)',
                         [('-3 minutes', 20.5), ('-2 minutes', 21.0), ('-1 minutes', 21.5)])
          db.commit()
          "
          cat > "$RUNNER_TEMP/edge/tiles-edge.toml" <<'TOML'
          [tiles]
          url = "http://localhost:8000"
          [agent]
          heartbeat_seconds = 30
          [[sql]]
          name = "plant-db"
          engine = "sqlite"
          path = "plant.sqlite"
          poll_seconds = 2
          [[sql.queries]]
          name = "quality"
          query = "SELECT id, at, temperature FROM quality WHERE id > :watermark ORDER BY id"
          watermark = "id"
          start = 0
          time = "at"
          columns = { temperature = "ci.temperature" }
          TOML
          docker build -t tiles-edge edge
          # The SQL drivers load in the image (a refused connection, not a missing library)
          docker run --rm --entrypoint python tiles-edge -c "
          import psycopg, mssql_python
          try:
              mssql_python.connect('Server=tcp:127.0.0.1,1;UID=x;PWD=y;Encrypt=yes', attrs_before={103: 2})
          except Exception as e:
              assert 'Failed to load the driver' not in str(e), e
          "
          docker run --rm --network host -e TILES_EDGE_TOKEN="$token" -v "$RUNNER_TEMP/edge:/etc/tiles-edge:ro" \
            tiles-edge check -c /etc/tiles-edge/tiles-edge.toml | tee /dev/stderr | jq -e .ok
          curl -fsS "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
            | tee /dev/stderr | jq -e '.[] | select(.name == "ci-edge") | .status == "online"'
          # `run` reads the database into its disk buffer (the image's /var/lib/tiles-edge), sends the
          # readings to Tiles, and reports the buffer in its heartbeat.
          docker run -d --name ci-edge --network host -e TILES_EDGE_TOKEN="$token" \
            -v "$RUNNER_TEMP/edge:/etc/tiles-edge:ro" tiles-edge
          stored="SELECT count(*) FROM samples s JOIN signals g ON g.id = s.signal_id WHERE g.tag = 'ci.temperature'"
          for _ in $(seq 60); do
            test "$(docker compose exec -T db psql -U tiles -d tiles -tAc "$stored")" = 3 && break
            sleep 1
          done
          docker logs ci-edge
          test "$(docker compose exec -T db psql -U tiles -d tiles -tAc "$stored")" = 3
          for _ in $(seq 40); do  # the next heartbeat (every 30 s) reports them sent
            curl -fsS "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" \
              | jq -e '.[] | select(.name == "ci-edge") | .buffer | .sent == 3 and .queued == 0' && break
            sleep 1
          done
          curl -fsS "http://localhost:8000/sites/$site/agents" -H "Authorization: Bearer $t" | tee /dev/stderr \
            | jq -e '.[] | select(.name == "ci-edge") | .buffer.sent == 3 and (.connectors[0].status == "ok")'
          docker stop ci-edge
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
