# A release (T6.04, docs/releasing.md): pushing a version tag v1.2.3 checks that every file states
# 1.2.3 and CHANGELOG.md has its section, then publishes a GitHub release with those notes, the
# Helm chart and the edge agent as one file. The Images workflow publishes the images for the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release and its files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: The tag, the files and the changelog agree
        run: |
          version=$(node scripts/version.js check)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "The tag is $GITHUB_REF_NAME but the files say $version"; exit 1; }
          node scripts/version.js notes "$version" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The chart and the edge agent
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          helm package deploy/helm/tiles --destination "$RUNNER_TEMP/out"
          python3 -m zipapp edge/src -m tiles_edge.cli:entry -p "/usr/bin/env python3" \
            -o "$RUNNER_TEMP/out/tiles-edge-$VERSION.pyz"
          "$RUNNER_TEMP/out/tiles-edge-$VERSION.pyz" --version | grep -qx "tiles-edge $VERSION"
          (cd "$RUNNER_TEMP/out" && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tiles $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease "$RUNNER_TEMP"/out/*
