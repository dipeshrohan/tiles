# A release (T6.04, docs/releasing.md). Pushing a version tag v1.2.3, or running this workflow
# by hand with a version and a commit on main (it makes the tag once the checks pass):
# 1. checks the commit is on main and CI passed on it, every file states 1.2.3, and
#    CHANGELOG.md has a dated section for it;
# 2. publishes the images tagged 1.2.3 and 1.2 (the Images workflow);
# 3. publishes a GitHub release with those notes, the Helm chart (its images pinned to 1.2.3) and
#    the edge agent as one file.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: the version to release (1.2.3); the tag v1.2.3 is made
        type: string
        required: true
      commit:
        description: the commit on main to release (its full SHA)
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag, when run by hand
      actions: read # CI's runs on the commit
    env:
      TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
      SHA: ${{ inputs.commit || github.sha }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        name: The tag, the files and the changelog agree
        run: |
          version=$(node scripts/version.js check)
          test "v$version" = "$TAG" || { echo "The tag is $TAG but the files say $version"; exit 1; }
          node scripts/version.js notes "$version" --released > /dev/null
          sha=$(git rev-parse --verify "$SHA^{commit}")
          { echo "version=$version"; echo "tag=$TAG"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      - name: The commit is on main, and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "$TAG isn't on main: release only what main has"; exit 1; }
          passed=$(gh run list --workflow CI --commit "$SHA" --status success --json databaseId --jq length)
          test "$passed" -gt 0 || { echo "CI hasn't passed on $SHA"; exit 1; }
      - name: Make the tag (when run by hand)
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Tiles ${TAG#v}" "$SHA"
          git push origin "refs/tags/$TAG"

  images:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      sha: ${{ needs.check.outputs.sha }}
      version: ${{ needs.check.outputs.version }}

  release:
    name: Release ${{ needs.check.outputs.tag }}
    needs: [check, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release and its files
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: The chart, its images pinned to this release, and the edge agent
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node scripts/version.js notes "$VERSION" --released > "$RUNNER_TEMP/notes.md"
          # The released chart installs this release, not whatever main has become.
          sed -i -E "s/^    tag: main$/    tag: '$VERSION'/; s/^    pullPolicy: Always$/    pullPolicy: IfNotPresent/" \
            deploy/helm/tiles/values.yaml
          test "$(grep -c "^    tag: '$VERSION'$" deploy/helm/tiles/values.yaml)" = 2
          helm lint deploy/helm/tiles --set oidc.issuer=https://idp.example.com
          helm package deploy/helm/tiles --destination "$RUNNER_TEMP/out"
          python3 -m zipapp edge/src -m tiles_edge.cli:entry -p "/usr/bin/env python3" \
            -o "$RUNNER_TEMP/out/tiles-edge-$VERSION.pyz"
          "$RUNNER_TEMP/out/tiles-edge-$VERSION.pyz" --version | grep -qx "tiles-edge $VERSION"
          (cd "$RUNNER_TEMP/out" && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "$TAG" --verify-tag --title "Tiles $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease "$RUNNER_TEMP"/out/*
