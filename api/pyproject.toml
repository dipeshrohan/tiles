[project]
name = "tiles-api"
version = "0.1.0"
description = "Tiles backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.12.1",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tiles-api = "tiles_api.main:run"
tiles-migrate = "tiles_api.db:main"
tiles-seed = "tiles_api.seed:main"
tiles-check-quality = "tiles_api.quality:main"
tiles-run-models = "tiles_api.models.runner:main"
tiles-detect = "tiles_api.detector_job:main"
tiles-backtest = "tiles_api.api_backtest:main"
tiles-notify = "tiles_api.notify:main"
tiles-run-sweeps = "tiles_api.sweeps:main"
tiles-rotate-keys = "tiles_api.sealed:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiles_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
