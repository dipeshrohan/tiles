# Local development stack: `docker compose up --build --wait`
#
#   web    http://localhost:5173   the Tiles app (static files)
#   api    http://localhost:8000   FastAPI; /health, /ready, /docs
#   db     localhost:5432          PostgreSQL 17 + TimescaleDB
#   redis  localhost:6379          job queue
#   migrate                        applies database migrations, then exits
#   keycloak http://localhost:8080  sign-in (realm tiles; users demo/demo,
#                                  admin/admin, viewer/viewer; console admin/admin-dev)
#
# Ports bind to 127.0.0.1 only. Credentials are for local development;
# override with TILES_DB_PASSWORD in your shell or a root .env file (git-ignored).
# The password is embedded in a connection URL, so use URL-safe characters
# (letters, digits, - . _ ~). It is applied only when the db volume is first
# created: after changing it, run `docker compose down -v` (deletes the data).

name: tiles

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: tiles
      POSTGRES_PASSWORD: ${TILES_DB_PASSWORD:-tiles-dev}
      POSTGRES_DB: tiles
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first start the image runs a temporary server on the Unix
      # socket only, then restarts; checking the socket would report healthy too early.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U tiles -d tiles']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies database migrations and creates the demo site, then exits; the
  # API starts only if it succeeds.
  migrate:
    build: ./api
    image: tiles-api:dev
    command: ['sh', '-c', 'tiles-migrate upgrade && tiles-seed']
    environment:
      TILES_DATABASE_URL: postgresql://tiles:${TILES_DB_PASSWORD:-tiles-dev}@db:5432/tiles
    depends_on:
      db:
        condition: service_healthy

  # Single sign-on for development. The realm (keycloak/tiles-realm.json) is
  # imported on first start; its users and passwords are for local use only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TILES_KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      # Tokens name this issuer whichever address requested them.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      # The image has no curl; ask the management port with bash.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 3s
      timeout: 3s
      retries: 60

  api:
    build: ./api
    image: tiles-api:dev
    environment:
      TILES_ENV: development
      TILES_OIDC_ISSUER: http://localhost:8080/realms/tiles
      TILES_OIDC_JWKS_URL: http://keycloak:8080/realms/tiles/protocol/openid-connect/certs
      TILES_DATABASE_URL: postgresql://tiles:${TILES_DB_PASSWORD:-tiles-dev}@db:5432/tiles
      TILES_REDIS_URL: redis://redis:6379/0
      TILES_CORS_ORIGINS: '["http://localhost:5173"]'
      # The copilot (T4.01) stays off unless both are set in your shell or the root .env file.
      TILES_ANTHROPIC_API_KEY: ${TILES_ANTHROPIC_API_KEY:-}
      TILES_COPILOT_MODEL: ${TILES_COPILOT_MODEL:-}
      # Seals credentials stored in the database (T5.06); unset, they are stored as they are.
      TILES_DATA_KEYS: ${TILES_DATA_KEYS:-}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: ['node', 'server.js']
    volumes:
      - ./:/app:ro
    ports:
      - '127.0.0.1:5173:5173'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:5173/']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
