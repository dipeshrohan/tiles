# Local development stack: `docker compose up --build --wait`
#
#   web    http://localhost:5173   the Tiles app (static files)
#   api    http://localhost:8000   FastAPI; /health, /ready, /docs
#   db     localhost:5432          PostgreSQL 17 + TimescaleDB
#   redis  localhost:6379          job queue
#   migrate                        applies database migrations, then exits
#
# Ports bind to 127.0.0.1 only. Credentials are for local development;
# override with TILES_DB_PASSWORD in your shell or a root .env file (git-ignored).
# The password is embedded in a connection URL, so use URL-safe characters
# (letters, digits, - . _ ~). It is applied only when the db volume is first
# created: after changing it, run `docker compose down -v` (deletes the data).

name: tiles

services:
  db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: tiles
      POSTGRES_PASSWORD: ${TILES_DB_PASSWORD:-tiles-dev}
      POSTGRES_DB: tiles
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiles -d tiles']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies database migrations, then exits; the API starts only if it succeeds.
  migrate:
    build: ./api
    image: tiles-api:dev
    command: ['tiles-migrate', 'upgrade']
    environment:
      TILES_DATABASE_URL: postgresql://tiles:${TILES_DB_PASSWORD:-tiles-dev}@db:5432/tiles
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    image: tiles-api:dev
    environment:
      TILES_ENV: development
      TILES_DATABASE_URL: postgresql://tiles:${TILES_DB_PASSWORD:-tiles-dev}@db:5432/tiles
      TILES_REDIS_URL: redis://redis:6379/0
      TILES_CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: ['node', 'server.js']
    volumes:
      - ./:/app:ro
    ports:
      - '127.0.0.1:5173:5173'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:5173/']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
